<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Ali Roonkiani, CEO of NWPT, and AURA, the Portuguese robotic ultrasound assistant.">
<title>Ali Roonkiani · AURA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: single centred phone-width card, hero → contact → AURA → gallery → links → share */
:root{--bg:#f3f6fa;--surface:#fff;--surface2:#eaf0f7;--fg:#0b1b33;--muted:#53657f;--line:#d6e0ec;--accent:#0a7fc2;--accent2:#00b4e6;--on-accent:#fff;--hero1:#0a2a52;--hero2:#0b5a97;--hero-fg:#fff;--shadow:0 10px 30px rgba(10,42,82,.12);--display:'Sora',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060e1c;--surface:#0d1b31;--surface2:#12253f;--fg:#e8f0fb;--muted:#8fa5c2;--line:#1d3354;--accent:#27c1f5;--accent2:#6fdcff;--on-accent:#04121f;--hero1:#071a35;--hero2:#0a3f72;--shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#060e1c;--surface:#0d1b31;--surface2:#12253f;--fg:#e8f0fb;--muted:#8fa5c2;--line:#1d3354;--accent:#27c1f5;--accent2:#6fdcff;--on-accent:#04121f;--hero1:#071a35;--hero2:#0a3f72;--shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:16px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{border-radius:28px;overflow:hidden;background:radial-gradient(120% 90% at 80% 0%,var(--hero2),var(--hero1) 70%);color:var(--hero-fg);padding:22px 20px 22px;position:relative;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(111,220,255,.25);box-shadow:0 0 0 28px rgba(111,220,255,.06),0 0 0 58px rgba(111,220,255,.04);pointer-events:none}
.bar{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.chip{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:#bfe9fb;border:1px solid rgba(191,233,251,.35);padding:5px 10px;border-radius:99px}
.lang{display:flex;gap:4px}
.lang button{font:600 12px var(--body);color:#fff;background:rgba(255,255,255,.1);border:0;border-radius:99px;padding:6px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:#0a2a52}
.who{display:flex;gap:16px;align-items:center;margin-top:20px;position:relative;z-index:1}
.who img{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:50% 25%;border:3px solid rgba(255,255,255,.9);flex:none}
h1{font:700 26px/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.role{margin:6px 0 0;color:#cfe6f7;font-size:14px}
.role b{color:#fff;font-weight:600}
.tag{margin:18px 0 0;font:500 15px/1.45 var(--display);color:#e6f6ff;position:relative;z-index:1;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.card h2{font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.row:first-of-type{border-top:0}
.ico{width:38px;height:38px;border-radius:12px;background:var(--surface2);color:var(--accent);display:grid;place-items:center;flex:none}
.ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.txt{flex:1;min-width:0}
.txt small{display:block;color:var(--muted);font-size:12px}
.txt span{display:block;font-weight:500;overflow-wrap:anywhere}
.cp{font:600 12px var(--body);border:1px solid var(--line);background:transparent;color:var(--accent);border-radius:99px;padding:7px 12px;cursor:pointer;flex:none}
.cp:hover{background:var(--surface2)}
.aura{display:flex;flex-direction:column;gap:14px}
.logo{background:#fff;border-radius:16px;padding:10px 14px;border:1px solid var(--line)}
.logo img{display:block;width:100%}
.aura p{margin:0;color:var(--fg)}
.facts{display:grid;grid-template-columns:1fr;gap:8px;margin:0;padding:0;list-style:none}
.facts li{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border-radius:14px;padding:11px 13px;font-size:14px}
.facts i{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));margin-top:7px;flex:none}
.status{font-size:12.5px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gal img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;display:block;border:1px solid var(--line)}
.links{display:grid;gap:10px}
.btn{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;font:600 15px var(--body);border:1px solid var(--line);background:var(--surface2);min-width:0}
.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--on-accent);border:0}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn span{flex:1;min-width:0;overflow-wrap:anywhere}
.btn em{font:500 12px var(--body);font-style:normal;opacity:.75}
.share{display:flex;gap:16px;align-items:center}
#qr{background:#fff;padding:8px;border-radius:14px;flex:none;line-height:0}
#qr img,#qr canvas{width:112px!important;height:112px!important}
.share p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:4px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font:600 13px var(--body);opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.theme{background:none;border:0;color:var(--muted);font:500 12px var(--body);cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}</style></head><body>
